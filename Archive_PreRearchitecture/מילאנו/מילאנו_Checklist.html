<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מילאנו — צ'ק-ליסט הזמנות</title>
<style>
  :root {
    --ink: #241f1a;
    --paper: #faf6ef;
    --muted: #6b6157;
    --gold: #c8a24a;
    --accent: #a13d3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', Arial, sans-serif;
    direction: rtl;
    text-align: right;
    line-height: 1.7;
    padding: 30px 6vw 60px;
  }
  h1 { font-size: 30px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 26px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 16px rgba(60,45,25,0.09);
  }
  th, td {
    padding: 14px 16px;
    text-align: right;
    border-bottom: 1px solid #eee2cf;
    font-size: 15px;
  }
  th {
    background: #f2ece0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  tr.done td { color: #a89f8f; text-decoration: line-through; }
  tr:last-child td { border-bottom: none; }
  td.check-col { width: 46px; text-align: center; }
  input[type="checkbox"] { width: 19px; height: 19px; cursor: pointer; }
  .urgent {
    display: block;
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 700;
  }
  td.date-col { white-space: nowrap; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

  <h1>צ'ק-ליסט הזמנות — מילאנו</h1>
  <div class="sub">22–23.7 · 4 משתתפים (2 מבוגרים, בן 17, בת 12) · בלי רכב</div>

  <table>
    <thead>
      <tr>
        <th class="check-col">✓</th>
        <th>משימה</th>
        <th>תאריך מ</th>
        <th>תאריך עד</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script>
const DESTINATION_KEY = 'מילאנו';
const STORAGE_PREFIX = 'kessler-checklist-' + DESTINATION_KEY + '-';

const ROWS = [
  { id: 'flights', task: 'טיסות הלוך ושוב', from: '22.7.2026', to: '23.7.2026' },
  { id: 'hotel-center', task: 'מלון — מרכז מילאנו (אזור הדואומו)', from: '22.7.2026', to: '23.7.2026' },
  { id: 'cenacolo', task: 'הסעודה האחרונה של דה וינצ\'י (Cenacolo Vinciano) — הזמנת כניסה בזמן קבוע', from: '22.7.2026', to: '22.7.2026',
    urgent: '⚠️ בד"כ נדרשת הזמנה 2-3 חודשים מראש — הטיול בעוד כשבועיים, כדאי לבדוק מיד זמינות של רגע אחרון או ביטולים באתר הרשמי' },
  { id: 'duomo-terrace', task: 'הדואומו — כרטיסי גג/דילוג בתור (עונת שיא ביולי)', from: '22.7.2026', to: '22.7.2026' },
  { id: 'qcterme', task: 'QC Termemilano — הזמנת סלוט כניסה', from: '22.7.2026', to: '22.7.2026' },
  { id: 'backdoor43', task: 'Backdoor 43 — הזמנת מקום מראש (בר זעיר, ~4 מ"ר)', from: '23.7.2026', to: '23.7.2026' }
];

function render() {
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  ROWS.forEach(row => {
    const checked = localStorage.getItem(STORAGE_PREFIX + row.id) === '1';
    const tr = document.createElement('tr');
    if (checked) tr.classList.add('done');
    tr.innerHTML = `
      <td class="check-col"><input type="checkbox" ${checked ? 'checked' : ''} data-id="${row.id}"></td>
      <td>${row.task}${row.urgent ? `<span class="urgent">${row.urgent}</span>` : ''}</td>
      <td class="date-col">${row.from}</td>
      <td class="date-col">${row.to}</td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      localStorage.setItem(STORAGE_PREFIX + e.target.dataset.id, e.target.checked ? '1' : '0');
      render();
    });
  });
}

render();
</script>

</body>
</html>
