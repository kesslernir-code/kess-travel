function formatHebrewDuration(totalSeconds) {
  const totalMinutes = Math.round(totalSeconds / 60);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours === 0) return `${minutes} דקות`;
  if (minutes === 0) return `${hours} שעות`;
  return `${hours} שעות ו-${minutes} דקות`;
}
function formatHebrewDistance(meters) {
  return `${Math.round(meters / 1000)} ק"מ`;
}
function roundToHalfHour(mins) {
  return Math.round(mins / 30) * 30;
}
function minutesToClock(mins) {
  const m = ((mins % 1440) + 1440) % 1440;
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function clockToMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function initMap() {
  // Must be defined here, not as a top-level class -- google isn't defined yet
  // when this script block's top-level statements first run (async Maps script tag).
  DistanceLabel = class extends google.maps.OverlayView {
    constructor(position, text) {
      super();
      this.position = position;
      this.text = text;
    }
    onAdd() {
      this.div = document.createElement('div');
      this.div.style.position = 'absolute';
      this.div.style.background = '#fff';
      this.div.style.border = '1px solid #999';
      this.div.style.borderRadius = '10px';
      this.div.style.padding = '1px 6px';
      this.div.style.fontSize = '11px';
      this.div.style.fontWeight = '700';
      this.div.style.whiteSpace = 'nowrap';
      this.div.style.transform = 'translate(-50%, -50%)';
      this.div.textContent = this.text;
      this.getPanes().overlayLayer.appendChild(this.div);
    }
    draw() {
      const proj = this.getProjection();
      if (!proj || !this.div) return;
      const pos = proj.fromLatLngToDivPixel(this.position);
      this.div.style.left = pos.x + 'px';
      this.div.style.top = pos.y + 'px';
    }
    onRemove() {
      if (this.div) { this.div.parentNode.removeChild(this.div); this.div = null; }
    }
  };

  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 45.9432, lng: 24.9668 },
    zoom: 13
  });
  geocoder = new google.maps.Geocoder();
  directionsService = new google.maps.DirectionsService();
  sharedInfoWindow = new google.maps.InfoWindow();

  buildDayTabs();
  geocodeAllPoints();
  geocodeOvernightBases();
  fetchAllDayRoutes();
}

function selectView(view, btnEl) {

  document.querySelectorAll('#dayTabs button').forEach(b => {
    b.classList.remove('active');

  if (view === 'overview') {

  } else {
    const d = DAYS.find(x => x.id === view);
    btnEl.style.background = d.color;
    btnEl.style.color = '#fff';
  }
  render();
}

          // A marker's own label can't fit "Sibiu, 2 לילות" legibly (it's

          if (DistanceLabel) {

          }

      });

  });
}

function fetchAllDayRoutes() {
  DAYS.forEach((d, di) => {
    setTimeout(() => {
      // Chained origin: day N starts from where day N-1 actually ended up
      // sleeping, not from one fixed trip-wide address (a relocating road
      // trip's day 5 should start from day 4's town, not day 1's).
      const origin = di === 0 ? BASE_ADDRESS : DAYS[di - 1].baseQuery;
      const hasStops = d.route.length > 0;
      // returnsToBase: this day's own overnight base is the SAME as
      // tomorrow's -- i.e. it's a day-trip out-and-back from a stable
      // accommodation (or day 1 traveling in to that first-night base),
      // not a leg of a relocating road trip. In that case route back to the
      // base itself instead of stopping dead at the last sightseeing stop --
      // "we go from the house and back to the house every day" needs the way
      // back drawn too. ALL of d.route becomes waypoints (not slice(0,-1))
      // since none of them is the final destination anymore; when d.route is
      // empty (a pure travel day -- a late arrival's day 1 legitimately has
      // no stops at all) this degrades to a single clean origin->base leg
      // instead of crashing on POINTS[undefined].
      const waypoints = (d.returnsToBase ? d.route : d.route.slice(0, -1))
        .map(id => ({ location: POINTS[id].query, stopover: true }));
      const destination = (d.returnsToBase || !hasStops)
        ? d.baseQuery
        : POINTS[d.route[d.route.length - 1]].query;
      directionsService.route({
        origin: origin,
        destination: destination,
        waypoints: waypoints,
        travelMode: google.maps.TravelMode[TRIP_TRAVEL_MODE]
      }, (result, status) => {
        if (status === 'OK') {
          d._directionsResult = result;
          const legs = result.routes[0].legs;
          dayLegsMinutes[d.id] = legs.map(l => Math.round(l.duration.value / 60));
          d._totalSeconds = legs.reduce((sum, l) => sum + l.duration.value, 0);
          d._totalMeters = legs.reduce((sum, l) => sum + l.distance.value, 0);

          const renderer = new google.maps.DirectionsRenderer({
            suppressMarkers: true,
            preserveViewport: true,
            polylineOptions: { strokeColor: d.color, strokeWeight: 4, strokeOpacity: 0.8 }
          });
          renderer.setDirections(result);
          dayRenderers[d.id] = renderer;

          // Each leg's on-map label names where that leg actually leads --
          // for a normal stop that's POINTS[d.route[li]]; the one extra
          // trailing leg a returnsToBase day adds (the drive back) has no
          // corresponding route entry, so it falls through to naming the
          // accommodation instead.
          dayLabelOverlays[d.id] = legs.map((leg, li) => {
            const mid = google.maps.geometry
              ? google.maps.geometry.spherical.interpolate(leg.start_location, leg.end_location, 0.5)
              : leg.start_location;
            const destPoint = POINTS[d.route[li]];
            const labelText = destPoint
              ? (destPoint.name + ' — ' + formatHebrewDistance(leg.distance.value))
              : (d.returnsToBase ? ('🏠 חזרה ל' + (d.sleepPointName || d.base) + ' — ' + formatHebrewDistance(leg.distance.value)) : formatHebrewDistance(leg.distance.value));
            return new DistanceLabel(mid, labelText);
          });
        } else {
          console.warn('Directions failed for day', d.id, status);
        }
        render();
      });
    }, di * 400);
  });
}

function render() {
  DAYS.forEach(d => {
    const show = currentView === 'overview' || currentView === d.id;
    d.route.forEach(id => { if (POINTS[id].marker) POINTS[id].marker.setMap(show ? map : null); });
    if (dayRenderers[d.id]) dayRenderers[d.id].setMap(show ? map : null);
    if (dayLabelOverlays[d.id]) dayLabelOverlays[d.id].forEach(o => o.setMap(show ? map : null));
  });

  if (currentView === 'overview') {
    fitBoundsToAll();
    renderOverviewContent();
  } else {
    const d = DAYS.find(x => x.id === currentView);
    fitBoundsToDay(d);
    renderDayContent(d);
  }
}

function fitBoundsToAll() {
  const locs = Object.values(POINTS).filter(p => p.location).map(p => p.location);
  if (!locs.length) return;
  const bounds = new google.maps.LatLngBounds();
  locs.forEach(l => bounds.extend(l));
  map.fitBounds(bounds);
}

function fitBoundsToDay(d) {
  const locs = d.route.map(id => POINTS[id]).filter(p => p.location).map(p => p.location);
  if (!locs.length) return;
  const bounds = new google.maps.LatLngBounds();
  locs.forEach(l => bounds.extend(l));
  map.fitBounds(bounds);
}

function buildPieSVG(counts, size) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  if (!total) return '';
  const r = size / 2;
  let angle = -90;
  const paths = [];
  Object.keys(counts).forEach(cat => {
    const val = counts[cat];
    if (!val) return;
    const frac = val / total;
    const startAngle = angle;
    const endAngle = angle + frac * 360;
    angle = endAngle;
    const large = (endAngle - startAngle) > 180 ? 1 : 0;
    const toXY = (a) => [r + r * Math.cos(a * Math.PI / 180), r + r * Math.sin(a * Math.PI / 180)];
    const [x1, y1] = toXY(startAngle);
    const [x2, y2] = toXY(endAngle);
    if (frac >= 0.999) {
      paths.push(`<circle cx="${r}" cy="${r}" r="${r}" fill="${CATEGORY_COLORS[cat]}" />`);
    } else {
      paths.push(`<path d="M${r},${r} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${CATEGORY_COLORS[cat]}" />`);
    }
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths.join('')}</svg>`;
}

function categoryCounts(ids) {
  const counts = { City: 0, Attraction: 0, Food: 0 };
  ids.forEach(id => { const c = POINTS[id].category; counts[c] = (counts[c] || 0) + 1; });
  return counts;
}

function renderOverviewContent() {
  const el = document.getElementById('content');
  const allIds = DAYS.flatMap(d => d.route);
  const totalSeconds = DAYS.reduce((s, d) => s + (d._totalSeconds || 0), 0);
  let html = `<div class="section-title">כל הימים — סקירה</div>`;
  html += `<div class="pie-wrap">${buildPieSVG(categoryCounts(allIds), 90)}
    <div class="pie-legend">
      <div><span class="dot" style="background:${CATEGORY_COLORS.City}"></span>עיר</div>
      <div><span class="dot" style="background:${CATEGORY_COLORS.Attraction}"></span>אטרקציה</div>
      <div><span class="dot" style="background:${CATEGORY_COLORS.Food}"></span>אוכל</div>
    </div></div>`;
  if (totalSeconds) {
    html += `<div class="trip-total">סה"כ ${TRIP_TRAVEL_VERB} בין הנקודות בכל הטיול: ${formatHebrewDuration(totalSeconds)}</div>`;
  }
  DAYS.forEach(d => {
    const stopsNames = d.route.map(id => POINTS[id].name).join(' ← ');
    const timeText = d._totalSeconds ? formatHebrewDuration(d._totalSeconds) : 'מחשב...';
    html += `<div class="day-summary-row" data-day="${d.id}" style="border-inline-start-color:${d.color}">
      <div>
        <div class="dsr-title">${d.label} — ${d.date}</div>
        <div class="dsr-meta">${stopsNames}</div>
        <div class="dsr-meta">${TRIP_TRAVEL_ICON} ${timeText} ${TRIP_TRAVEL_VERB} בין הנקודות</div>
      </div>
    </div>`;
  });
  html += `<div class="worth-hint">כדי לראות מרחקים מבסיס הלינה ל"עוד דברים ששווה לדעת עליהם", פתחו יום ספציפי.</div>`;
  el.innerHTML = html;
  el.querySelectorAll('.day-summary-row').forEach(row => {
    row.addEventListener('click', () => {
      const d = DAYS.find(x => x.id == row.dataset.day);
      selectView(d.id, d._tabBtn);
    });
  });
}

function renderDayContent(d) {
  const el = document.getElementById('content');
  // Prefer the exact manually-designated accommodation name over the
  // generic town when one was set (see finalplan.js's sleepPointName) --
  // the town-level d.base still backs the Checklist's "book a hotel in this
  // town" search links, but the day card itself should show the real place.
  const sleepLabel = d.sleepPointName || d.base;
  let html = `<div class="section-title">${d.label} — ${d.date}</div>`;
  if (d.base) html += `<div class="base-line">🛏 לינה הלילה: ${sleepLabel}${d._totalMeters ? ' · 🚗 ' + formatHebrewDistance(d._totalMeters) + ' נסיעה היום' : ''}</div>`;
  html += `<div class="intro-line">${d.intro}</div>`;
  html += `<div class="pie-wrap">${buildPieSVG(categoryCounts(d.route), 70)}
    <div class="pie-legend">
      <div><span class="dot" style="background:${CATEGORY_COLORS.City}"></span>עיר</div>
      <div><span class="dot" style="background:${CATEGORY_COLORS.Attraction}"></span>אטרקציה</div>
      <div><span class="dot" style="background:${CATEGORY_COLORS.Food}"></span>אוכל</div>
    </div></div>`;

  if (d.note) html += `<div class="intro-line" style="background:#f0f0ff;">💡 ${d.note}</div>`;

  html += `<div class="field-block"><b>ארוחת בוקר</b>${d.breakfast || 'לפי שעת הנחיתה — ראו הערה בלוח הזמנים'}</div>`;

  html += `<div class="section-title">לוח זמנים</div><div class="schedule">${buildScheduleHTML(d)}</div>`;

  html += `<div class="section-title">נקודות עניין</div>`;
  d.route.forEach(id => {
    const p = POINTS[id];
    html += `<div class="poi-card" data-id="${id}" style="border-inline-start-color:${CATEGORY_COLORS[p.category]}">
      <h4>${p.rec ? '⭐ ' : ''}${p.name}</h4>
      <p>${p.desc}</p>
    </div>`;
  });

  if (d.restaurants && d.restaurants.length) {
    html += `<div class="section-title">מסעדות מומלצות</div>`;
    d.restaurants.forEach(r => {
      const p = POINTS[r.id];
      html += `<div class="rest-card"><b>${p.name}</b> — ${r.note}<br>${p.desc}</div>`;
    });
  }

  if (d.isDeparture) {
    html += `<div class="departure-line">🛫 יציאה לנמל התעופה בהתאם לשעת הטיסה חזרה</div>`;
  } else {
    html += `<div class="lodging-line">🛏 לינה הלילה: ${sleepLabel}</div>`;
  }

  html += `<div class="worth-section" id="worthSection"><div class="section-title">עוד דברים ששווה לדעת עליהם</div><div id="worthList">מחשב מרחקים מ${d.base}...</div></div>`;

  el.innerHTML = html;
  el.querySelectorAll('.poi-card').forEach(card => {
    card.addEventListener('click', () => focusMapPoint(card.dataset.id));
  });

  renderWorthSection(d);
}

function buildScheduleHTML(d) {
  const legs = dayLegsMinutes[d.id];
  if (!legs) return '<div class="sched-item"><span class="sched-label">מחשב זמני ${TRIP_TRAVEL_VERB} אמיתיים מול Google Maps...</span></div>';

  const blocks = [];
  let clock;
  if (d.wake) {
    clock = clockToMinutes(d.wake);
    blocks.push({ time: clock, icon: '⏰', label: 'קימה' });
    clock += 30;
    blocks.push({ time: clock, icon: '🥐', label: d.breakfast });
    clock += 45;
  } else if (d.startTime) {
    clock = clockToMinutes(d.startTime);
    blocks.push({ time: clock, icon: '🛬', label: d.startLabel });
  } else {
    // wake/startTime/startLabel/breakfast are only ever present on the
    // template's own Milan fixture data -- rendermaps.js's real DAYS never
    // set them, so this crashed on clockToMinutes(undefined) the instant
    // anyone opened a real trip's day tab. Default to a plain day-start
    // instead of assuming either field exists.
    clock = 540; // 09:00
  }

  d.route.forEach((id, idx) => {
    const p = POINTS[id];
    const walkMin = legs[idx] || 0;
    clock += walkMin;
    clock = roundToHalfHour(clock);
    if (walkMin > 0) {
      blocks.push({ time: clock, icon: '🚶', label: `${TRIP_TRAVEL_VERB} (${formatHebrewDuration(walkMin * 60)})`, muted: true });
    }
    blocks.push({ time: clock, icon: CATEGORY_ICONS[p.category] || '📍', label: (p.rec ? '⭐ ' : '') + p.name });
    clock += p.visitMin;
    clock = roundToHalfHour(clock);
  });

  // returnsToBase adds one extra leg beyond d.route's own stops (the drive
  // back) -- legs[d.route.length] is exactly that trailing leg, mirroring
  // how isDeparture below appends its own final block. Mutually exclusive
  // by construction (a departure day never returnsToBase), so no double-up.
  if (d.returnsToBase && legs[d.route.length] !== undefined) {
    const backMin = legs[d.route.length];
    clock += backMin;
    clock = roundToHalfHour(clock);
    blocks.push({ time: clock, icon: '🏠', label: `חזרה ל${d.sleepPointName || d.base} (${formatHebrewDuration(backMin * 60)})`, muted: true });
  }

  if (d.isDeparture) {
    blocks.push({ time: clock, icon: '🛫', label: 'יציאה לנמל התעופה' });
  }

  return blocks.map(b => `<div class="sched-item">
      <div class="sched-time">${minutesToClock(b.time)}</div>
      <div class="sched-icon">${b.icon}</div>
      <div class="sched-label" style="${b.muted ? 'color:#888;font-size:12px;' : ''}">${b.label}</div>
    </div>`).join('');
}

function renderWorthSection(d) {
  const listEl = document.getElementById('worthList');
  if (!listEl) return;

  if (!worthCache[d.base]) {
    worthCache[d.base] = {};
    let idx = 0;
    EXTRA_REGIONS.forEach(region => {
      region.points.forEach(p => {
        const key = p.name;
        setTimeout(() => {
          directionsService.route({
            origin: d.baseQuery,
            destination: p.query,
            travelMode: google.maps.TravelMode.DRIVING
          }, (result, status) => {
            if (status === 'OK') {
              const leg = result.routes[0].legs[0];
              worthCache[d.base][key] = formatHebrewDuration(leg.duration.value) + ' נסיעה';
            } else {
              worthCache[d.base][key] = 'מרחק לא זמין';
            }
            if (currentView === d.id) renderWorthList(d);
          });
        }, idx * 180);
        idx++;
      });
    });
    renderWorthList(d);
  } else {
    renderWorthList(d);
  }
}

function renderWorthList(d) {
  const listEl = document.getElementById('worthList');
  if (!listEl) return;
  const cache = worthCache[d.base] || {};
  let html = '';
  EXTRA_REGIONS.forEach(region => {
    html += `<div class="worth-region">${region.region}</div>`;
    region.points.forEach(p => {
      const dist = cache[p.name];
      html += `<div class="worth-row" data-name="${p.name.replace(/"/g, '&quot;')}" data-query="${p.query.replace(/"/g, '&quot;')}" data-category="${p.category}">
        <span class="dot" style="background:${CATEGORY_COLORS[p.category] || '#999'}"></span>
        <span class="worth-name">${p.name}</span>
        <span class="worth-dist">${dist || '...'}</span>
      </div>`;
    });
  });
  listEl.innerHTML = html;
  listEl.querySelectorAll('.worth-row').forEach(row => {
    row.addEventListener('click', () => focusExtraPoint(row.dataset.name, row.dataset.query, row.dataset.category));
  });
}

function animateMarkerScale(marker, fromScale, toScale, duration) {
  const start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    const icon = Object.assign({}, marker.getIcon());
    icon.scale = fromScale + (toScale - fromScale) * eased;
    marker.setIcon(icon);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function focusMapPoint(id) {
  const p = POINTS[id];
  if (!p || !p.marker || !p.location) return;
  if (focusedId && focusedId !== id && POINTS[focusedId] && POINTS[focusedId].marker) {
    const prev = POINTS[focusedId];
    animateMarkerScale(prev.marker, (prev.rec ? 9 : 7) * 1.9, prev.rec ? 9 : 7, 250);
  }
  focusedId = id;
  const base = p.rec ? 9 : 7;
  animateMarkerScale(p.marker, base, base * 1.9, 300);
  map.panTo(p.location);
  sharedInfoWindow.setContent(p.infoContent);
  sharedInfoWindow.open(map, p.marker);
}

function focusExtraPoint(name, query, category) {
  if (extraMarkers[name]) {
    map.panTo(extraMarkers[name].getPosition());
    sharedInfoWindow.setContent(`<div dir="rtl" style="text-align:right;"><b>${name}</b></div>`);
    sharedInfoWindow.open(map, extraMarkers[name]);
    return;
  }
  geocoder.geocode({ address: query, componentRestrictions: { country: "RO" } }, (results, status) => {
    if (status === 'OK' && results[0]) {
      const loc = results[0].geometry.location;
      const marker = new google.maps.Marker({
        position: loc, map: map,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: CATEGORY_COLORS[category] || '#999', fillOpacity: 0.85, strokeColor: '#fff', strokeWeight: 2 },
        title: name
      });
      extraMarkers[name] = marker;
      map.panTo(loc);
      sharedInfoWindow.setContent(`<div dir="rtl" style="text-align:right;"><b>${name}</b></div>`);
      sharedInfoWindow.open(map, marker);
    }
  });
}
