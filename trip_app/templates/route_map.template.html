<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Route Planner — Milan</title>
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif; }
  #app { display: flex; height: 100%; }
  #map { flex: 1 1 auto; height: 100%; }
  #sidebar { width: 400px; flex: 0 0 400px; height: 100%; overflow-y: auto; border-right: 3px solid #ddd; box-sizing: border-box; padding: 16px; background: #fafafa; direction: rtl; text-align: right; }
  /* Phone: the 400px fixed sidebar next to the map was the real cause of
     horizontal overflow on narrow screens -- stack map above list instead
     of side-by-side, each full width. */
  @media (max-width: 768px) {
    #app { flex-direction: column; }
    #map { flex: 0 0 42vh; height: 42vh; }
    #sidebar { width: 100%; flex: 1 1 auto; height: auto; border-right: none; border-top: 3px solid #ddd; }
  }
  h2 { margin-top: 0; font-size: 18px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend-rec { font-size: 12px; color: #7a5b00; margin-bottom: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.3); flex-shrink: 0; }
  .region-title { font-weight: bold; margin: 16px 0 6px; font-size: 14px; color: #222; background: #eee; padding: 4px 8px; border-radius: 4px; }
  .sleep-subheader { font-size: 11px; font-weight: bold; color: #1a1a4e; margin: 6px 0 3px; padding-inline-start: 4px; }
  .region-days-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: normal; color: #444; margin-top: 4px; }
  .region-days-row select { font-size: 11.5px; padding: 1px 4px; border-radius: 4px; border: 1px solid #ccc; }
  .region-sleeploc-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: normal; margin-top: 4px; }
  .region-sleeploc-row input { flex: 1 1 auto; font-size: 11.5px; padding: 3px 6px; border-radius: 4px; border: 1px solid #ccc; min-width: 0; }
  .region-sleeploc-row button { flex: 0 0 auto; font-size: 11.5px; padding: 3px 7px; border-radius: 4px; border: 1px solid #1a1a4e; background: #eef0fa; color: #1a1a4e; cursor: pointer; }
  .region-sleeploc-row button:hover { background: #dde1f5; }
  .region-sleeploc-status { font-size: 11px; color: #1a1a4e; margin-top: 2px; margin-inline-start: 2px; }
  .region-title:hover { background: #e0e0e0; }
  .region-title-row { display: flex; align-items: center; gap: 6px; }
  .region-label { cursor: pointer; flex: 1 1 auto; }
  .region-dist { display: block; font-weight: normal; font-size: 11px; color: #555; margin-top: 2px; margin-inline-start: 24px; }
  .poi-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; }
  .poi-row:hover { background: #f0f0f0; }
  .poi-row .dot { flex: 0 0 auto; cursor: pointer; }
  .poi-row .poi-name { flex: 1 1 auto; cursor: pointer; }
  .sleep-tag { font-size: 10px; background: #1a1a4e; color: #fff; border-radius: 4px; padding: 1px 5px; margin-inline-start: 4px; flex-shrink: 0; }
  /* Invisible by default -- at 0.45 opacity it still read as "every point has
     a bed icon" at a glance, since the toggle itself is always present. Now
     only a hovered row reveals it faintly, and only an actually-marked point
     shows it for real (full opacity, regardless of hover), so a glance at
     the list only shows a bed on what's actually designated. */
  .sleep-toggle { flex: 0 0 auto; font-size: 13px; padding: 1px 5px; border-radius: 4px; border: 1.5px solid #ccc; background: #fff; cursor: pointer; opacity: 0; line-height: 1.4; transition: opacity .15s; }
  .poi-row:hover .sleep-toggle { opacity: 0.35; }
  .sleep-toggle:hover { opacity: 0.8 !important; }
  .sleep-toggle.active { opacity: 1 !important; border-color: #1a1a4e; background: #eef0fa; }
  .rec-tag { font-size: 10px; background: #b8860b; color: #fff; border-radius: 4px; padding: 1px 5px; margin-inline-start: 4px; flex-shrink: 0; }
  .rec-star { font-size: 12px; margin-inline-start: 4px; flex-shrink: 0; }
  #confirmBtn { width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: bold; background: #1a7a3c; color: white; border: none; border-radius: 6px; cursor: pointer; position: sticky; bottom: 0; }
  #confirmBtn:hover { background: #145c2d; }
  #backBtn { width: 100%; margin-top: 8px; padding: 8px; font-size: 13px; background: #eee; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
  #routeSummary { margin-top: 16px; font-size: 13px; }
  #routeSummary .leg { padding: 8px; margin-bottom: 6px; background: white; border-inline-start: 4px solid #1a7a3c; border-radius: 4px; }
  #status { font-size: 12px; color: #888; margin-top: 10px; }
  .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(0,0,0,0.15); border-top-color: #1a7a3c; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px; margin-inline-end: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .info-desc { font-size: 12px; max-width: 260px; line-height: 1.5; }
  .info-source { font-size: 11px; margin-top: 6px; }
  .info-rec { font-size: 11px; color: #b8860b; font-weight: bold; margin-top: 4px; }
  .selectAllRow { font-size: 12px; margin-bottom: 8px; }
  .selectAllRow a { cursor: pointer; color: #1a5fb4; margin-inline-end: 10px; }
  .filterRow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .filterBtn { font-size: 11px; padding: 4px 9px; border-radius: 12px; border: 1.5px solid #ccc; background: #fff; cursor: pointer; color: #333; }
  .filterBtn[data-cat]:not([data-cat="all"]) { border-color: var(--cat-color); color: var(--cat-color); }
  .filterBtn.active { color: #fff; background: #555; border-color: #555; font-weight: bold; }
  .filterBtn.active[data-cat]:not([data-cat="all"]) { background: var(--cat-color); }
  #suggestBtn { width: 100%; margin-top: 10px; padding: 10px; font-size: 13px; font-weight: bold; background: #1a5fb4; color: white; border: none; border-radius: 6px; cursor: pointer; }
  #fullViewBtn { width: 100%; margin-bottom: 10px; padding: 9px; font-size: 12.5px; font-weight: bold; background: #fff; color: #1a5fb4; border: 1.5px solid #1a5fb4; border-radius: 6px; cursor: pointer; }
  #fullViewBtn:hover { background: #eef4fc; }
  #suggestBtn:hover { background: #124a8f; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="sidebar">
    <h2>מסלול מילאנו — כל נקודות העניין</h2>
    <button id="fullViewBtn">🗺️ תצוגה מלאה — כל האזורים</button>
    <div class="filterRow" id="filterRow">
      <button class="filterBtn active" data-cat="all">הצג הכל</button>
      <button class="filterBtn" data-cat="Nature" style="--cat-color:#27ae60">טבע</button>
      <button class="filterBtn" data-cat="City" style="--cat-color:#8e44ad">עיר</button>
      <button class="filterBtn" data-cat="Beach" style="--cat-color:#2980b9">חוף</button>
      <button class="filterBtn" data-cat="Attraction" style="--cat-color:#e67e22">אטרקציה</button>
      <button class="filterBtn" data-cat="Food" style="--cat-color:#c0392b">אוכל</button>
      <button class="filterBtn" data-cat="Sleep" style="--cat-color:#1a1a4e">לינה</button>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#27ae60"></span>טבע</span>
      <span><span class="dot" style="background:#8e44ad"></span>עיר</span>
      <span><span class="dot" style="background:#2980b9"></span>חוף</span>
      <span><span class="dot" style="background:#e67e22"></span>אטרקציה</span>
      <span><span class="dot" style="background:#c0392b"></span>אוכל</span>
      <span><span class="dot" style="background:#1a1a4e"></span>לינה</span>
    </div>
    <div class="legend-rec">⭐ = מומלץ — מקורות מרובים מציינים כ"חובה לראות"</div>
    <div class="selectAllRow"><a id="selectAll">בחר הכל</a><a id="clearAll">נקה הכל</a></div>
    <div id="checklist">טוען נקודות...</div>
    <button id="suggestBtn">💡 הצע בחירה מתאימה לטיול</button>
    <button id="confirmBtn">✅ נעילת הבחירה הסופית</button>
    <button id="backBtn" class="hidden">⬅ חזרה לעריכת הרשימה</button>
    <div id="routeSummary"></div>
    <div id="status"></div>
  </div>
</div>

  Nature: '#27ae60', City: '#8e44ad', Beach: '#2980b9',

};

  { id:'palazzoreale', name:'Palazzo Reale', query:'Palazzo Reale, Milan, Italy', category:'Attraction',

// IMPORTANT: keep the same object identity between REGIONS and POINTS (no spread/copy here).
// The checklist below is built by walking REGIONS, while geocoding/markers are attached to
// POINTS -- if these were different object copies of the same data, a checkbox toggle would
// check `.marker` on an object that never actually got a marker, and silently do nothing.

// Within each region, City-category points are actual towns/villages -- the
// real candidates for where to base overnight in this area -- so they lead
// the list as their own group, recommended first. Everything else follows,
// grouped by category (same order as the legend), recommended first within
// each. Makes "where could I sleep here" the first thing scanned per region,
// not buried alphabetically among attractions.
const SLEEP_CANDIDATE_CATEGORY = 'City';
const CATEGORY_ORDER = ['Nature', 'Beach', 'Attraction', 'Food', 'Sleep'];
REGIONS.forEach(r => {
  r.points.sort((a, b) => {
    const aSleep = a.category === SLEEP_CANDIDATE_CATEGORY ? 0 : 1;
    const bSleep = b.category === SLEEP_CANDIDATE_CATEGORY ? 0 : 1;
    if (aSleep !== bSleep) return aSleep - bSleep;
    const recDiff = (b.rec ? 1 : 0) - (a.rec ? 1 : 0);
    if (recDiff !== 0) return recDiff;
    if (aSleep === 0) return 0; // both sleep candidates -- recommended-order only, no further split
    return CATEGORY_ORDER.indexOf(a.category) - CATEGORY_ORDER.indexOf(b.category);
  });
});

const POINTS = REGIONS.flatMap(r => r.points);

function baseScaleFor(p) {
  return p.isSleep ? 10 : (p.rec ? 9 : 7);
}

// Google's localized duration/distance text can come back as a mix of Hebrew and English
// (e.g. "3 שעות 5 mins") even with &language=he on the API load -- so we build our own
// fully-Hebrew strings from the raw numeric value instead of trusting that text field.
function formatHebrewDuration(totalSeconds) {
  const totalMinutes = Math.round(totalSeconds / 60);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours === 0) return `${minutes} דקות`;
  if (minutes === 0) return `${hours} שעות`;
  return `${hours} שעות ו-${minutes} דקות`;
}
function formatHebrewDistance(meters) {
  return `${Math.round(meters / 1000)} ק"מ`;
}

let map, geocoder, directionsService, sharedInfoWindow, focusedPoint;

// setRegionSleepLocation() rebuilds the whole checklist (buildChecklist()) so
// a newly-added custom point's row/count appears immediately -- that wipes
// every <input> in #checklist, including any OTHER region's sleep-location
// text the user typed but hasn't clicked "קבע במפה" on yet. Snapshotted here
// (by region index) right before the rebuild and restored after, so typing in
// one region's box while confirming another's doesn't lose unsaved text.
const pendingSleepInputText = {};

// Pure *view* filter -- completely separate from each point's checkbox/selection state.
// A marker is only ever actually shown on the map when both conditions hold: the user
// has it checked AND it matches the active category filter (or the filter is 'all').
// Never flip p.checked because of the filter -- filtering must never uncheck anything.
let currentFilter = 'all';
function pointVisible(p) {
  return !!p.checked && (currentFilter === 'all' || p.category === currentFilter);
}
function updateMarkerForPoint(p) {
  if (p.marker) p.marker.setMap(pointVisible(p) ? map : null);
}

function setFilter(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filterBtn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  POINTS.forEach(p => updateMarkerForPoint(p));
  document.querySelectorAll('.poi-row').forEach(row => {
    row.classList.toggle('hidden', !(cat === 'all' || row.dataset.category === cat));
  });
}

function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 45.4642, lng: 9.19 },
    zoom: 12
  });
  geocoder = new google.maps.Geocoder();
  directionsService = new google.maps.DirectionsService();
  // Single shared InfoWindow so opening a new bubble always closes any other open one.
  sharedInfoWindow = new google.maps.InfoWindow();
  buildChecklist();
  geocodeAllPoints();
  document.getElementById('confirmBtn').addEventListener('click', onConfirm);
  document.getElementById('backBtn').addEventListener('click', onBack);
  document.getElementById('selectAll').addEventListener('click', () => setAll(true));
  document.getElementById('clearAll').addEventListener('click', () => setAll(false));
  document.getElementById('suggestBtn').addEventListener('click', applySuggestedSelection);
  document.getElementById('fullViewBtn').addEventListener('click', showAllRegions);
  document.querySelectorAll('.filterBtn').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.cat)));
}

function setAll(state) {
  POINTS.forEach(p => {
    p.checked = state;
    const chk = document.getElementById('chk_' + p.id);
    if (chk) chk.checked = state;
    updateMarkerForPoint(p);
  });
  REGIONS.forEach(r => syncRegionCheckbox(r));
}

// Straight-line distance in km between two geocoded points -- used only to rank "nearest
// unused point" candidates within/around a region, not for real routing.
function haversineKm(a, b) {
  if (!a || !b) return Infinity;
  const toRad = d => d * Math.PI / 180;
  const R = 6371;
  const dLat = toRad(b.lat() - a.lat());
  const dLng = toRad(b.lng() - a.lng());
  const lat1 = toRad(a.lat()), lat2 = toRad(b.lat());
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// 3 points/day for a relaxed/family/light pace, 5 for a packed/intense pace, 4 otherwise.
function pointsPerDayFromPace(pace) {
  const s = (pace || '').toString();
  if (/רגוע|משפחתי|קל/.test(s)) return 3;
  if (/עמוס|אינטנסיבי|הרבה/.test(s)) return 5;
  return 4;
}

// Pure client-side heuristic -- no network calls. Builds TRIP_DAYS day-shaped geographic
// clusters (never a flat, ungrouped pick) and stops there; it never auto-confirms, the
// user still reviews/adjusts every cluster before confirming.
function applySuggestedSelection() {
  const pointsPerDay = pointsPerDayFromPace(TRIP_PACE);
  const nonSleep = p => p.category !== 'Sleep';
  const allNonSleep = POINTS.filter(nonSleep);
  const recommendedPool = allNonSleep.filter(p => p.rec);

  const used = new Set();
  const seededRegions = new Set();
  const clusters = [];

  function pickSeed() {
    // Prefer an unused recommended point from a region not yet used as a seed this run,
    // so days don't all pile into the same corner of the map.
    let pool = recommendedPool.filter(p => !used.has(p.id) && !seededRegions.has(p.regionName));
    if (!pool.length) pool = recommendedPool.filter(p => !used.has(p.id));
    if (!pool.length) pool = allNonSleep.filter(p => !used.has(p.id) && !seededRegions.has(p.regionName));
    if (!pool.length) pool = allNonSleep.filter(p => !used.has(p.id));
    return pool[0] || null;
  }

  for (let day = 1; day <= TRIP_DAYS; day++) {
    const seed = pickSeed();
    if (!seed) break; // ran out of points entirely
    seededRegions.add(seed.regionName);
    used.add(seed.id);
    const dayPoints = [seed];

    // Fill the rest of this day's quota with the nearest unused points -- same region first,
    // spilling into the nearest points from other regions if this region runs out, so every
    // day ends up genuinely full rather than thin. Mix categories so a day isn't all-Nature
    // or all-Food.
    while (dayPoints.length < pointsPerDay) {
      const sameRegion = allNonSleep.filter(p => !used.has(p.id) && p.regionName === seed.regionName);
      const pool = sameRegion.length ? sameRegion : allNonSleep.filter(p => !used.has(p.id));
      if (!pool.length) break;

      const catCounts = {};
      dayPoints.forEach(p => { catCounts[p.category] = (catCounts[p.category] || 0) + 1; });
      pool.sort((a, b) => {
        const ca = catCounts[a.category] || 0, cb = catCounts[b.category] || 0;
        if (ca !== cb) return ca - cb; // least-represented category in this day first
        return haversineKm(seed.location, a.location) - haversineKm(seed.location, b.location);
      });
      const next = pool[0];
      dayPoints.push(next);
      used.add(next.id);
    }
    clusters.push({ day, points: dayPoints });
  }

  // Separately, one Sleep-tagged point per region actually used across the clusters --
  // a base needs somewhere to sleep even though the lodging point itself isn't a "visit",
  // and it doesn't count against the per-day point target.
  const usedRegions = new Set();
  clusters.forEach(c => c.points.forEach(p => usedRegions.add(p.regionName)));
  let sleepAdded = 0;
  usedRegions.forEach(regionName => {
    const sleepPoint = POINTS.find(p => p.regionName === regionName && p.category === 'Sleep' && !used.has(p.id));
    if (sleepPoint) {
      used.add(sleepPoint.id);
      sleepAdded++;
    }
  });

  POINTS.forEach(p => {
    p.checked = used.has(p.id);
    const chk = document.getElementById('chk_' + p.id);
    if (chk) chk.checked = p.checked;
    updateMarkerForPoint(p);
  });
  REGIONS.forEach(r => syncRegionCheckbox(r));

  // Number of days per region is part of the suggestion, not an afterthought --
  // count how many of the suggested days actually touch each region, and push
  // that into the region's own day dropdown so it's visible and adjustable,
  // not just implied by which points got checked.
  const regionDayCounts = {};
  clusters.forEach(c => {
    const daysTouched = new Set(c.points.map(p => p.regionName));
    daysTouched.forEach(rn => { regionDayCounts[rn] = (regionDayCounts[rn] || 0) + 1; });
  });
  REGIONS.forEach((r, ri) => {
    // Not `|| r.days || 1` -- an untouched region should keep whatever the
    // user already set (including an explicit 0), not get bounced to 1 just
    // because 0 is falsy in JS.
    const suggested = regionDayCounts[r.region];
    const fallback = typeof r.days === 'number' ? r.days : 1;
    r.days = Math.min(TRIP_DAYS, suggested !== undefined ? suggested : fallback);
    const sel = document.getElementById('regiondays_' + ri);
    if (sel) sel.value = String(r.days);
    const slRow = document.getElementById('sleeploc_' + ri);
    if (slRow) slRow.style.display = r.days >= 1 ? 'flex' : 'none';
  });

  const perDayText = clusters.map(c => `יום ${c.day}: ${c.points.length} נקודות`).join(', ');
  let msg = `💡 הצעה ל-${TRIP_DAYS} ימי טיול (קצב ${TRIP_PACE}, ${pointsPerDay} נקודות ליום) -- ${perDayText}. `;
  msg += `בסה"כ ${used.size - sleepAdded} נקודות ביקור + ${sleepAdded} נקודות לינה, ב-${usedRegions.size} אזורים. `;
  if (clusters.length < TRIP_DAYS) {
    msg += `לא נמצאו מספיק נקודות פנויות למלא את כל ${TRIP_DAYS} הימים. `;
  }
  msg += 'זו הצעת פתיחה לבדיקה בלבד -- לא שיבוץ ימים סופי ולא בחירה סופית. אפשר לשנות ולסמן/להסיר נקודות לפני האישור.';
  document.getElementById('status').textContent = msg;
}

// Keep a region's own master checkbox in sync with its points: checked if every point in the
// region is checked, unchecked if none are, indeterminate if it's a mix.
function syncRegionCheckbox(r) {
  if (!r._regionCheckboxEl) return;
  const total = r.points.length;
  const checkedCount = r.points.filter(p => p.checked).length;
  r._regionCheckboxEl.checked = checkedCount === total;
  r._regionCheckboxEl.indeterminate = checkedCount > 0 && checkedCount < total;
}

function buildChecklist() {
  const container = document.getElementById('checklist');
  container.innerHTML = '';
  REGIONS.forEach((r, ri) => {
    if (typeof r.days !== 'number') r.days = 1;
    const rTitle = document.createElement('div');
    rTitle.className = 'region-title';
    // 0 is a real, meaningful choice -- "we pass through / tour here but don't
    // sleep here" -- not just an off-by-one gap below 1.
    const dayOptions = Array.from({ length: TRIP_DAYS + 1 }, (_, i) => i)
      .map(n => `<option value="${n}"${n === r.days ? ' selected' : ''}>${n === 0 ? '0 (סיור בלבד, ללא לינה)' : n}</option>`).join('');
    rTitle.innerHTML = `
      <div class="region-title-row">
        <input type="checkbox" class="region-check" id="regionchk_${ri}" checked>
        <span class="region-label" title="לחץ כדי לסמן על המפה את גבולות האזור הזה">${r.region} (${r.points.length})</span>
      </div>
      <div class="region-days-row">
        <label for="regiondays_${ri}">מספר ימי לינה באזור זה:</label>
        <select id="regiondays_${ri}" class="region-days-select">${dayOptions}</select>
      </div>
      <div class="region-sleeploc-row" id="sleeploc_${ri}" style="display:${r.days >= 1 ? 'flex' : 'none'}">
        <input type="text" id="sleeplocinput_${ri}" placeholder="מיקום לינה סופי (מלון/כתובת) -- אפשר להשלים בהמשך">
        <button type="button" id="sleeplocbtn_${ri}">🛏 קבע במפה</button>
      </div>
      <div class="region-sleeploc-status" id="sleeplocstatus_${ri}"></div>
      <span class="region-dist" id="regiondist_${ri}"></span>
    `;
    container.appendChild(rTitle);
    // A returning visit already has this region's custom sleep point baked
    // into r.points (see rendermaps.js's toRegions) -- prefill the field and
    // status instead of showing an empty slot the user already filled once.
    const existingCustom = r.points.find(p => p.custom);
    const sleepInput = rTitle.querySelector('#sleeplocinput_' + ri);
    const sleepStatus = rTitle.querySelector('#sleeplocstatus_' + ri);
    if (existingCustom) {
      sleepInput.value = existingCustom.name;
      sleepStatus.textContent = '🛏 נקבע במפה';
    } else if (pendingSleepInputText[ri]) {
      sleepInput.value = pendingSleepInputText[ri];
    }
    const sleepBtn = rTitle.querySelector('#sleeplocbtn_' + ri);
    sleepBtn.addEventListener('click', () => {
      setRegionSleepLocation(r, ri, sleepInput.value.trim(), sleepStatus, sleepBtn);
    });
    rTitle.querySelector('.region-days-select').addEventListener('change', (e) => {
      // NOT `|| 1` -- 0 is falsy in JS but a legitimate, explicit choice here
      // ("tour this region, don't sleep in it"); `0 || 1` would silently
      // bounce it back up to 1 the moment the dropdown fires its change event.
      const v = parseInt(e.target.value, 10);
      r.days = Number.isNaN(v) ? 1 : v;
      const slRow = document.getElementById('sleeploc_' + ri);
      if (slRow) slRow.style.display = r.days >= 1 ? 'flex' : 'none';
    });
    r._regionCheckboxEl = rTitle.querySelector('.region-check');
    r._regionCheckboxEl.addEventListener('change', (e) => {
      const state = e.target.checked;
      r.points.forEach(p => {
        p.checked = state;
        const chk = document.getElementById('chk_' + p.id);
        if (chk) chk.checked = state;
        updateMarkerForPoint(p);
      });
    });
    rTitle.querySelector('.region-label').addEventListener('click', () => focusRegion(r.points));

    const sleepCandidates = r.points.filter(p => p.category === SLEEP_CANDIDATE_CATEGORY);
    if (sleepCandidates.length) {
      const sleepHeader = document.createElement('div');
      sleepHeader.className = 'sleep-subheader';
      sleepHeader.textContent = '🛏 אפשרויות מומלצות ללינה באזור זה';
      container.appendChild(sleepHeader);
    }
    let restHeaderShown = !sleepCandidates.length;
    r.points.forEach(p => {
      if (!restHeaderShown && p.category !== SLEEP_CANDIDATE_CATEGORY) {
        const restHeader = document.createElement('div');
        restHeader.className = 'sleep-subheader';
        restHeader.textContent = 'שאר הנקודות באזור';
        container.appendChild(restHeader);
        restHeaderShown = true;
      }
      const row = document.createElement('div');
      row.className = 'poi-row';
      row.dataset.category = p.category;
      row.innerHTML = `
        <span class="dot" style="background:${CATEGORY_COLORS[p.category]}"></span>
        <input type="checkbox" id="chk_${p.id}"${p.checked === false ? '' : ' checked'}>
        <span class="poi-name" dir="rtl" title="לחץ כדי למקד את המפה על המקום הזה">${p.name}</span>
        ${p.rec ? '<span class="rec-star" title="מומלץ">⭐</span>' : ''}
        <span class="sleep-tag" style="display:${p.isSleep ? 'inline-block' : 'none'}">לינה</span>
        <button type="button" class="sleep-toggle${p.isSleep ? ' active' : ''}" title="סמן/בטל כמקום לינה רשמי">🛏</button>
        ${p.rec ? '<span class="rec-tag">מומלץ</span>' : ''}
      `;
      container.appendChild(row);
      row.querySelector('input').addEventListener('change', (e) => {
        p.checked = e.target.checked;
        updateMarkerForPoint(p);
        syncRegionCheckbox(r);
      });
      row.querySelector('.poi-name').addEventListener('click', () => focusPoint(p));
      row.querySelector('.dot').addEventListener('click', () => focusPoint(p));
      // Manually designate a point as an official overnight base -- sent to
      // the server as isSleep, which buildItinerary now treats as a real
      // constraint (place it as that night's base) rather than letting the
      // AI pick freely, so a returning user can lock in the hotel they
      // actually booked instead of hoping the itinerary agrees.
      row.querySelector('.sleep-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        p.isSleep = !p.isSleep;
        e.target.classList.toggle('active', p.isSleep);
        row.querySelector('.sleep-tag').style.display = p.isSleep ? 'inline-block' : 'none';
        if (p.marker) p.marker.setLabel(p.isSleep ? { text: '🛏', fontSize: '11px' } : null);
      });
    });
  });
}

// A region with 1+ days set needs somewhere to actually sleep -- the existing
// per-point 🛏 toggle only covers places that were already mined from a
// source, but the accommodation someone actually books is very often NOT one
// of those (a specific hotel found on Booking.com, not in any travel blog).
// This geocodes whatever the user typed and drops a real point onto the map
// for it (category 'Sleep', isSleep true), reusing the exact same pipeline
// path (POINTS -> onConfirm() -> server -> buildItinerary's isSleep rule)
// that an ordinary mined sleep point already goes through -- see run.js's
// runFinalPlanStage, which now also accepts a `custom` point that has no
// match in the mined plan instead of silently dropping it.
function setRegionSleepLocation(r, ri, text, statusEl, btnEl) {
  if (!text) { statusEl.textContent = '⚠️ הזן שם מקום או כתובת'; return; }
  // The button itself must visibly change on click -- a status line below it
  // is easy to miss entirely, and a click that doesn't visibly do anything
  // reads as "did that even register?". Same spinner-on-the-button pattern
  // as confirmBtn/suggestBtn elsewhere on this page.
  const originalLabel = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="spinner"></span>מאתר...';
  statusEl.innerHTML = '<span class="spinner"></span> מאתר במפה...';
  const query = `${text}, ${r.region}, ${DESTINATION_NAME}`;
  geocoder.geocode({ address: query, componentRestrictions: { country: GEOCODE_COUNTRY } }, (results, status2) => {
    if (status2 !== 'OK' || !results[0]) {
      statusEl.textContent = '⚠️ לא אותר במפה. נסה כתובת/שם מדויקים יותר.';
      btnEl.disabled = false;
      btnEl.textContent = originalLabel;
      return;
    }
    const location = results[0].geometry.location;
    // Replace, don't duplicate -- a region has exactly one official sleep location.
    const prevCustom = r.points.find(p => p.custom);
    if (prevCustom) {
      if (prevCustom.marker) prevCustom.marker.setMap(null);
      r.points = r.points.filter(p => p !== prevCustom);
      const gi = POINTS.indexOf(prevCustom);
      if (gi !== -1) POINTS.splice(gi, 1);
    }
    const point = {
      id: 'customsleep' + ri + '_' + Date.now(),
      name: text,
      category: 'Sleep',
      regionName: r.region,
      rec: false,
      desc: '',
      source: '',
      url: '',
      checked: true,
      isSleep: true,
      custom: true,
      location: location
    };
    r.points.push(point);
    POINTS.push(point);
    point.marker = new google.maps.Marker({
      position: location,
      map: pointVisible(point) ? map : null,
      title: '🛏 ' + text,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: baseScaleFor(point),
        fillColor: CATEGORY_COLORS[point.category],
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 2
      },
      label: { text: '🛏', fontSize: '11px' }
    });
    point.infoContent = buildInfoContent(point);
    point.marker.addListener('click', () => {
      sharedInfoWindow.setContent(point.infoContent);
      sharedInfoWindow.open(map, point.marker);
    });
    delete pendingSleepInputText[ri];
    // Full rebuild so the region's point count and the new row under it show
    // up immediately -- snapshot every OTHER region's not-yet-confirmed typed
    // text first so this doesn't wipe out what they were mid-typing.
    REGIONS.forEach((rr, i) => {
      const el = document.getElementById('sleeplocinput_' + i);
      if (el && i !== ri) pendingSleepInputText[i] = el.value;
    });
    buildChecklist();
  });
}

// Animate a marker's icon scale from its current size up to a bigger size and back down,
// so clicking a checklist item visibly "grows" the pin on the map instead of just panning to it.
function animateMarkerScale(marker, fromScale, toScale, duration) {
  const start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // ease-in-out
    const icon = Object.assign({}, marker.getIcon());
    icon.scale = fromScale + (toScale - fromScale) * eased;
    marker.setIcon(icon);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function focusPoint(p) {
  if (!p.marker || !p.location) {
    document.getElementById('status').textContent = 'עדיין מאתר את המיקום של ' + p.name + '...';
    return;
  }
  // Shrink whatever was previously focused back to its normal size.
  if (focusedPoint && focusedPoint !== p && focusedPoint.marker) {
    animateMarkerScale(focusedPoint.marker, baseScaleFor(focusedPoint) * 1.9, baseScaleFor(focusedPoint), 250);
  }
  focusedPoint = p;
  const base = baseScaleFor(p);
  animateMarkerScale(p.marker, base, base * 1.9, 300);
  map.panTo(p.location);
  if (map.getZoom() < 12) {
    map.setZoom(12);
  }
  // Clicking the checklist row should feel identical to clicking the marker itself -- both grow
  // the pin AND pop the info bubble, not just pan the map to it.
  if (p.infoContent) {
    sharedInfoWindow.setContent(p.infoContent);
    sharedInfoWindow.open(map, p.marker);
  }
}

// Andrew's monotone-chain convex hull over a set of google.maps.LatLng points -- gives us a
// simple polygon tracing the outermost points, which reads as "the general area" much better
// than just tightly zooming in on individual pins.
function convexHullLatLng(points) {
  if (points.length < 3) return points;
  const pts = points.map(p => ({ lng: p.lng(), lat: p.lat(), orig: p }))
    .sort((a, b) => a.lng - b.lng || a.lat - b.lat);
  const cross = (o, a, b) => (a.lng - o.lng) * (b.lat - o.lat) - (a.lat - o.lat) * (b.lng - o.lng);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop();
  upper.pop();
  return lower.concat(upper).map(h => h.orig);
}

// A region circle must read as "a reasonable area to base yourself in", not a
// shape that happens to enclose whatever's in that region -- a region with
// far-flung points (e.g. Cluj-Napoca to Baia Mare) would otherwise draw a
// circle spanning a huge chunk of the country. A single flat cap doesn't
// work across destination sizes though -- a real Corfu run showed a
// 70km-radius circle (fine for a country-scale trip like Romania) dwarfing
// the ENTIRE island, spilling into the sea and across into Albania. The cap
// must scale with how big the destination actually is: see regionRadiusCap().
const MAX_REGION_RADIUS_M = 70000; // absolute ceiling, for country-scale trips
const MIN_REGION_RADIUS_M = 2000; // degenerate-case-only floor (e.g. a region with 1 point) -- must stay well below any real 20%-of-area cap, or it overrides the area rule (a real Corfu run: 25000 floor > 9122 area cap, so every circle got floored back up to 25km)
let regionOverlay;
let allRegionOverlays = [];
let mainAreaCircle; // the persistent "main city area" circle -- see geocodeAllPoints()'s completion handler
let geocodingComplete = false; // guards regionRadiusCap() against judging destination size off a partial sample
function clearAllRegionOverlays() {
  allRegionOverlays.forEach(o => o.setMap(null));
  allRegionOverlays = [];
}

// Shared by showAllRegions() and focusRegion()'s circle-drawing (the latter
// is server-injected, see rendermaps.js) -- one formula (a 1.15x buffer
// around the farthest point, capped at MAX_REGION_RADIUS_M so a region with
// far-flung points can't draw a circle spanning a huge chunk of the
// country), one place to tune it instead of two independently-typed copies.
// A "nearby islands / day trips" region can genuinely include a place that's
// actually hundreds of km away (a real case: an extracted region for a Corfu
// trip included a Greek island in a completely different sea as a "day
// trip") -- averaging every point's location into one bounding box lets that
// ONE outlier drag the whole region's circle into empty space between the
// real cluster and the outlier, while the real nearby points end up sitting
// outside the circle entirely. Reject points far from the rough (median,
// not mean -- robust to a single wild value) center before computing the
// real circle; fall back to all points if that would reject everything.
// How big IS this whole destination, robustly? Using the farthest point
// would be wrecked by the same kind of day-trip outlier computeRegionCircle
// already guards against (a few distant-but-real islands don't make Corfu a
// "large" destination) -- the 75th-percentile distance from the overall
// center is dominated by the bulk of ordinary points and barely moves for a
// minority of far-flung ones. Recomputed fresh each call (cheap, ~100s of
// points) rather than cached, since geocoding finishes progressively and a
// cached early result from a handful of geocoded points would be wrong.
function destinationSpanM() {
  const allLocs = REGIONS.flatMap(r => r.points.filter(p => p.location).map(p => p.location));
  if (allLocs.length < 2) return MAX_REGION_RADIUS_M;
  // Median lat/lng, NOT a bounding-box center -- a bounding box is wrecked by
  // even one extreme outlier the same way computeRegionCircle's per-region
  // box was. A real check on this fixed destination still showed genuinely
  // local north-Corfu beaches (Sidari, Canal d'Amour) computed as ~280km
  // from "center", because the raw bounds included one ~300km-away outlier
  // (Naxos) and a bounding box's center shifts toward whatever it contains,
  // one point or ten.
  const lats = allLocs.map(l => l.lat()).sort((a, b) => a - b);
  const lngs = allLocs.map(l => l.lng()).sort((a, b) => a - b);
  const mid = Math.floor(allLocs.length / 2);
  const center = new google.maps.LatLng(lats[mid], lngs[mid]);
  const dists = allLocs.map(l => google.maps.geometry.spherical.computeDistanceBetween(center, l)).sort((a, b) => a - b);
  return dists[Math.floor(dists.length * 0.75)];
}

// Scale the per-region cap to that: roughly 60% of the destination's own
// core span, so a country-scale trip still gets the full 70km ceiling
// (unchanged from before) while a small, dense destination like an island
// gets a cap closer to a real "how far would you actually drive" distance.
// MUST NOT run on a partial geocoded set -- a real repeat of this exact bug
// happened when a region was clicked before geocoding finished: with only a
// handful of points resolved so far, destinationSpanM()'s 75th-percentile
// read as a much bigger number than the true destination size (the same
// class of skew a single outlier caused before, just from incompleteness
// instead), producing an oversized circle again. Before geocoding fully
// completes, there simply isn't enough data to judge the destination's real
// size yet -- fall back to the safe small floor rather than guess wrong.
// A region circle's AREA must not exceed 20% of the whole destination's own
// area (treating destinationSpanM() as that whole area's radius). Area scales
// with radius SQUARED, so capping by area (not just a fraction of the radius)
// is a meaningfully tighter, more principled constraint: area(r) <= 0.2 *
// area(R) implies r <= sqrt(0.2) * R =~ 0.447 * R, not 0.6 * R as tried
// before -- and reasoning in area is what "this region shouldn't dominate a
// fifth of the map" actually means, rather than an arbitrary radius fraction.
function regionRadiusCap() {
  if (!geocodingComplete) return MIN_REGION_RADIUS_M;
  const totalRadius = destinationSpanM();
  const maxByArea = Math.sqrt(0.2) * totalRadius;
  return Math.min(MAX_REGION_RADIUS_M, Math.max(MIN_REGION_RADIUS_M, maxByArea));
}

function computeRegionCircle(locs) {
  let finalLocs = locs;
  if (locs.length > 2) {
    const lats = locs.map(l => l.lat()).sort((a, b) => a - b);
    const lngs = locs.map(l => l.lng()).sort((a, b) => a - b);
    const mid = Math.floor(locs.length / 2);
    const roughCenter = new google.maps.LatLng(lats[mid], lngs[mid]);
    const OUTLIER_LIMIT_M = 150000; // ~a reasonable day-trip radius
    const kept = locs.filter(l => google.maps.geometry.spherical.computeDistanceBetween(roughCenter, l) <= OUTLIER_LIMIT_M);
    if (kept.length) finalLocs = kept;
  }
  const bounds = new google.maps.LatLngBounds();
  finalLocs.forEach(l => bounds.extend(l));
  const center = bounds.getCenter();
  let radius = 4000;
  finalLocs.forEach(l => { radius = Math.max(radius, google.maps.geometry.spherical.computeDistanceBetween(center, l) * 1.15); });
  radius = Math.min(radius, regionRadiusCap());
  return { center, radius };
}

// "Full view" (🗺️ תצוגה מלאה) -- draws every region's circle at once and zooms
// out to fit them all, instead of the one-at-a-time view a normal region click
// gives. Always circles (never the convex-hull polygon focusRegion can use
// for 3+ points) -- with every region on screen together a polygon connecting
// far-apart points across the whole map reads as route lines, not areas.
function showAllRegions() {
  if (regionOverlay) { regionOverlay.setMap(null); regionOverlay = null; }
  clearAllRegionOverlays();
  const combinedBounds = new google.maps.LatLngBounds();
  let anyDrawn = false;
  REGIONS.forEach(r => {
    const locs = r.points.filter(p => p.location).map(p => p.location);
    if (!locs.length) return;
    const { center, radius } = computeRegionCircle(locs);
    const circle = new google.maps.Circle({
      center: center, radius: radius,
      strokeColor: '#1a5fb4', strokeOpacity: 0.7, strokeWeight: 2,
      fillColor: '#1a5fb4', fillOpacity: 0.08, map: map
    });
    allRegionOverlays.push(circle);
    combinedBounds.union(circle.getBounds());
    anyDrawn = true;
  });
  if (anyDrawn) {
    map.fitBounds(combinedBounds);
    document.getElementById('status').textContent = 'תצוגה מלאה — כל האזורים מוצגים יחד.';
  } else {
    document.getElementById('status').textContent = 'עדיין מאתר מיקומים... נסו שוב בעוד רגע.';
  }
}

function focusRegion(regionPoints) {
  const locs = regionPoints.filter(p => p.location).map(p => p.location);
  if (locs.length === 0) {
    document.getElementById('status').textContent = 'עדיין מאתר את מיקומי האזור הזה...';
    return;
  }
  clearAllRegionOverlays();
  if (regionOverlay) {
    regionOverlay.setMap(null);
    regionOverlay = null;
  }
  const bounds = new google.maps.LatLngBounds();
  locs.forEach(l => bounds.extend(l));

  if (locs.length >= 3) {
    const hull = convexHullLatLng(locs);
    regionOverlay = new google.maps.Polygon({
      paths: hull,
      strokeColor: '#1a5fb4',
      strokeOpacity: 0.8,
      strokeWeight: 2,
      fillColor: '#1a5fb4',
      fillOpacity: 0.12,
      map: map
    });
  } else {
    // Not enough points for a meaningful polygon -- draw a circle around them instead.
    const center = bounds.getCenter();
    let maxDist = 3000;
    locs.forEach(l => { maxDist = Math.max(maxDist, google.maps.geometry.spherical.computeDistanceBetween(center, l) * 1.3); });
    regionOverlay = new google.maps.Circle({
      center: center,
      radius: maxDist,
      strokeColor: '#1a5fb4',
      strokeOpacity: 0.8,
      strokeWeight: 2,
      fillColor: '#1a5fb4',
      fillOpacity: 0.12,
      map: map
    });
  }

  // Deliberately not calling map.fitBounds()/setZoom() here -- the region overlay should be
  // visible against the whole-city view, not cause the map to zoom into that region.
}

function buildInfoContent(p) {
  return `<div dir="rtl" style="text-align:right; font-family:-apple-system,Segoe UI,Arial,sans-serif;">
      <b>${p.name}</b> <span style="color:${CATEGORY_COLORS[p.category]}">● ${CATEGORY_LABELS_HE[p.category]}</span>
      ${p.rec ? '<div class="info-rec">⭐ מומלץ — מקורות מציינים כחובה לראות</div>' : ''}
      <div class="info-desc">${p.desc}</div>
      <div class="info-source">מקור: ${p.source}${p.url ? ` — <a href="${p.url}" target="_blank" rel="noopener">קישור</a>` : ''}</div>
    </div>`;
}

// QC layer: geocoding a place name is not the same as verifying the result
// actually makes sense. componentRestrictions biases results toward the
// right country but doesn't guarantee it, and nothing checks whether a
// "Beach" point's resolved location is genuinely coastal. A suspicious point
// is unchecked and hidden outright (not left in the plan with a warning) --
// still reversible from its sidebar checkbox if the user disagrees, just not
// included by default. Logged to the console for whoever wants to check why,
// no remark shown in the UI itself.
function isSuspicious(p, geocodeResult) {
  const countryComp = (geocodeResult.address_components || []).find((c) => c.types.includes('country'));
  if (countryComp && countryComp.short_name !== GEOCODE_COUNTRY) {
    console.warn('QC excluded (wrong country: ' + countryComp.long_name + '):', p.name);
    return true;
  }
  if (p.category === 'Beach') {
    const types = geocodeResult.types || [];
    const looksSpecific = types.some((t) => ['natural_feature', 'point_of_interest', 'establishment', 'premise'].includes(t));
    if (!looksSpecific) {
      console.warn('QC excluded (beach resolved to a generic city/region, not a specific coastal feature):', p.name);
      return true;
    }
  }
  return false;
}

function autoReject(p) {
  p.checked = false;
  const chk = document.getElementById('chk_' + p.id);
  if (chk) chk.checked = false;
  updateMarkerForPoint(p);
}

// Runs once ALL points have geocoded (needs every region's full point set to
// judge what's "far from the rest") -- same median-based, outlier-robust
// center as computeRegionCircle.
function runGeoQcSummary() {
  REGIONS.forEach((r) => {
    const locs = r.points.filter((p) => p.location);
    if (locs.length < 3) return;
    const lats = locs.map((p) => p.location.lat()).sort((a, b) => a - b);
    const lngs = locs.map((p) => p.location.lng()).sort((a, b) => a - b);
    const mid = Math.floor(locs.length / 2);
    const roughCenter = new google.maps.LatLng(lats[mid], lngs[mid]);
    locs.forEach((p) => {
      const dist = google.maps.geometry.spherical.computeDistanceBetween(roughCenter, p.location);
      if (dist > 150000) {
        console.warn('QC excluded (~' + Math.round(dist / 1000) + 'km from the rest of region "' + r.region + '"):', p.name);
        autoReject(p);
      }
    });
  });
}

function geocodeAllPoints() {
  const status = document.getElementById('status');
  let done = 0;
  POINTS.forEach((p, i) => {
    // A returning visit to this tab (a trip that already has a final plan)
    // injects real checked/isSleep values reflecting the LAST confirmed
    // selection -- don't stomp that back to "everything checked" here.
    if (p.checked === undefined) p.checked = true;
    // Stagger requests slightly to stay well under geocoding rate limits
    setTimeout(() => {
      // componentRestrictions locks results to Italy the country (ISO "IT") -- without this,
      // a short/ambiguous query can silently resolve to the wrong country, since a status of
      // "OK" does not mean "found the right country".
      geocoder.geocode({ address: p.query, componentRestrictions: { country: 'IT' } }, (results, status2) => {
        done++;
        status.textContent = `מאתר מיקומים... (${done}/${POINTS.length})`;
        if (status2 === 'OK' && results[0]) {
          try {
            p.location = results[0].geometry.location;
            if (isSuspicious(p, results[0])) {
              p.checked = false;
              const chk = document.getElementById('chk_' + p.id);
              if (chk) chk.checked = false;
            }
            const markerOptions = {
              position: p.location,
              map: pointVisible(p) ? map : null,
              title: (p.rec ? '⭐ ' : '') + p.name,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: baseScaleFor(p),
                fillColor: CATEGORY_COLORS[p.category],
                fillOpacity: 1,
                strokeColor: p.rec ? '#FFD700' : '#fff',
                strokeWeight: p.rec ? 3 : 2
              }
            };
            // IMPORTANT: only set `label` when there's an actual label to show.
            // Passing label:null explicitly throws inside the Marker constructor
            // and silently aborts this whole callback (no info window, no click
            // listener) for every marker that hits that branch.
            if (p.isSleep) {
              markerOptions.label = { text: '🛏', fontSize: '11px' };
            }
            p.marker = new google.maps.Marker(markerOptions);
            // Stored on `p` (not just closed over here) so focusPoint() -- triggered by clicking
            // the place in the sidebar checklist, not just clicking the marker itself -- can open
            // the exact same bubble content.
            p.infoContent = buildInfoContent(p);
            p.marker.addListener('click', () => {
              sharedInfoWindow.setContent(p.infoContent);
              sharedInfoWindow.open(map, p.marker);
            });
          } catch (err) {
            p.geocodeFailed = true;
            console.error('Marker/InfoWindow setup failed for', p.name, err);
          }
        } else {
          p.geocodeFailed = true;
          console.warn('Geocode failed for', p.name, status2);
        }
        if (done === POINTS.length) {
          geocodingComplete = true;
          const failed = POINTS.filter(x => x.geocodeFailed);
          status.textContent = 'מוכן. סמן/הסר נקודות ולחץ על אישור.' + (failed.length ? ` (${failed.length} לא אותרו: ${failed.map(f=>f.name).join(', ')})` : '');
          computeRegionDistances();
          // The persistent main-area circle is drawn at map init, before any
          // point has geocoded -- regionRadiusCap() had nothing to measure
          // yet then, so it's redrawn here at its real size now that every
          // point's location is known (a real Corfu run showed exactly why
          // this matters: the un-scaled circle was hugely oversized for a
          // small island).
          if (mainAreaCircle) mainAreaCircle.setRadius(regionRadiusCap());
          runGeoQcSummary();
        }
      });
    }, i * 150);
  });
}

// Shows, under each region's title, the driving time from the Duomo (the city's central
// reference point) to a representative point in that region -- gives a quick sense of how far
// a region/day-trip is before deciding whether to include it in the trip at all.
function computeRegionDistances() {
  REGIONS.forEach((r, ri) => {
    const distEl = document.getElementById('regiondist_' + ri);
    if (!distEl) return;
    if (r.region === 'מרכז היסטורי ורובע האופנה') {
      distEl.textContent = 'אזור המרכז (הדואומו)';
      return;
    }
    // Prefer a City-tagged point as the representative for the region (more meaningful
    // than a random trailhead), falling back to the first successfully geocoded point.
    const rep = r.points.find(p => p.location && p.category === 'City')
             || r.points.find(p => p.location);
    if (!rep) {
      distEl.textContent = 'לא ניתן היה לחשב מרחק';
      return;
    }
    distEl.textContent = 'מחשב מרחק מהדואומו...';
    // Stagger these too -- firing several Directions requests at once right when geocoding
    // finishes risks silent rate-limit failures.
    setTimeout(() => {
      directionsService.route({
        origin: 'Duomo di Milano, Milan, Italy',
        destination: rep.location,
        travelMode: google.maps.TravelMode.DRIVING
      }, (result, status) => {
        if (status === 'OK') {
          const leg = result.routes[0].legs[0];
          distEl.textContent = `כ-${formatHebrewDuration(leg.duration.value)} נסיעה מהדואומו`;
        } else {
          console.warn('Distance-from-Duomo failed for region', r.region, status);
          distEl.textContent = 'זמן נסיעה לא זמין כרגע';
        }
      });
    }, ri * 300);
  });
}

// Confirm just locks in the current selection -- it does NOT build a route. Sequencing days
// and computing walking/driving times between legs is a separate skill's job, one step further
// down the pipeline; this artifact's whole purpose ends at "here are the curated points."
function onConfirm() {
  const checked = POINTS.filter(p => p.checked && p.marker);

  if (checked.length === 0) {
    alert('סמן לפחות נקודה אחת לפני אישור.');
    return;
  }

  document.getElementById('checklist').classList.add('hidden');
  document.getElementById('filterRow').classList.add('hidden');
  document.querySelector('.legend').classList.add('hidden');
  document.querySelector('.legend-rec').classList.add('hidden');
  document.querySelector('.selectAllRow').classList.add('hidden');
  document.getElementById('suggestBtn').classList.add('hidden');
  document.getElementById('confirmBtn').classList.add('hidden');
  document.getElementById('backBtn').classList.remove('hidden');

  if (regionOverlay) {
    regionOverlay.setMap(null);
    regionOverlay = null;
  }

  const summary = document.getElementById('routeSummary');
  summary.innerHTML = `<div class="region-title">הבחירה ננעלה (${checked.length} נקודות)</div>
    <div style="font-size:12px; color:#555; margin:6px 0 12px;">הרשימה הזו היא הקלט לסקיל הבא בפייפליין, שיבנה ממנה את המסלול בפועל (סדר ביקור וזמני הליכה/נסיעה).</div>`;

  REGIONS.forEach(r => {
    const inRegion = r.points.filter(p => p.checked && p.marker);
    if (inRegion.length === 0) return;
    const rTitle = document.createElement('div');
    rTitle.className = 'region-title';
    rTitle.textContent = r.region + ' (' + inRegion.length + ')';
    summary.appendChild(rTitle);
    inRegion.forEach(p => {
      const div = document.createElement('div');
      div.className = 'leg';
      div.style.borderInlineStartColor = CATEGORY_COLORS[p.category];
      div.innerHTML = `${p.rec ? '⭐ ' : ''}${p.name}${p.isSleep ? ' <span class="sleep-tag">לינה</span>' : ''}`;
      summary.appendChild(div);
    });
  });

  const bounds = new google.maps.LatLngBounds();
  checked.forEach(p => bounds.extend(p.location));
  map.fitBounds(bounds);

  sendSelectionToLocalServer(checked);
}

// Sends the confirmed selection to the local helper server (local_server.js,
// started via start_local_server.bat) so it gets written straight to
// <Destination>_Selection.json -- this is what lets the next pipeline stage
// pick up the confirmed points without the user needing to describe them or
// screenshot this page. If the local server isn't running, this fails
// silently into a plain-language status message; the on-screen locked list
// above still works as a fallback exactly like before.
function sendSelectionToLocalServer(checked) {
  const statusEl = document.getElementById('status');
  const points = checked.map(p => ({
    id: p.id, name: p.name, category: p.category, region: p.regionName,
    rec: !!p.rec, isSleep: !!p.isSleep, custom: !!p.custom
  }));
  // Per-region day count, from each region's own dropdown -- feeds the final
  // itinerary as a real constraint (see finalplan.js), not just an implicit
  // side-effect of which points happen to be checked. NOT `|| 1`: 0 is a real,
  // explicit choice ("tour this region, don't sleep in it") and 0 is falsy in
  // JS -- `0 || 1` would silently turn it back into 1 right here at send time.
  const regionDays = {};
  REGIONS.forEach(r => { regionDays[r.region] = typeof r.days === 'number' ? r.days : 1; });

  statusEl.innerHTML = '<span class="spinner"></span>שולח בחירה לשרת...';

  fetch(LOCAL_SERVER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ destination: DESTINATION_NAME, points, regionDays })
  })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        // The dashboard already auto-refreshes itself once tabs 5-7 are
        // ready (see render.js's renderDashboard) -- opening it now instead
        // of waiting here means that polling, not this page, is what tells
        // the user when the final plan actually finishes.
        statusEl.innerHTML = '<span class="spinner"></span>בונה את המסלול הסופי... פותח את הדשבורד';
        // window.top, NOT window -- this page is usually viewed embedded as
        // an <iframe> inside the dashboard's own tab-4 (see render.js's
        // renderDashboard). Navigating plain `window` only redirects that
        // iframe, which then loads the WHOLE dashboard recursively inside
        // itself -- a second full header+tab-bar rendered inside the first,
        // defaulting to tab 1, stacked directly under the real one. `top` is
        // the outermost window regardless of nesting, and is safely just
        // `window` itself on a direct, non-embedded page load.
        setTimeout(() => { window.top.location.href = `/${encodeURIComponent(DESTINATION_NAME)}/${encodeURIComponent(DESTINATION_NAME)}_KESSLER_TRIP.html`; }, 900);
      } else {
        statusEl.textContent = '⚠️ השרת הגיב עם שגיאה: ' + (data.error || 'שגיאה לא ידועה') + '. הרשימה למעלה עדיין תקפה -- אפשר לנסות שוב.';
      }
    })
    .catch(() => {
      statusEl.textContent = '⚠️ לא הצלחתי להתחבר לשרת. ודאו שהשרת פועל (הפעילו את האייקון בשולחן העבודה). הרשימה למעלה עדיין תקפה -- אפשר לנסות שוב.';
    });
}

function onBack() {
  document.getElementById('checklist').classList.remove('hidden');
  document.getElementById('filterRow').classList.remove('hidden');
  document.querySelector('.legend').classList.remove('hidden');
  document.querySelector('.legend-rec').classList.remove('hidden');
  document.querySelector('.selectAllRow').classList.remove('hidden');
  document.getElementById('suggestBtn').classList.remove('hidden');
  document.getElementById('confirmBtn').classList.remove('hidden');
  document.getElementById('backBtn').classList.add('hidden');
  document.getElementById('routeSummary').innerHTML = '';
}
</script>
